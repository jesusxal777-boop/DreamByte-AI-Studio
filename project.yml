name: DreamByteAIStudio
options:
  bundleIdPrefix: studios.dreambyte
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: studios.dreambyte.ai-studio
    INFOPLIST_KEY_CFBundleDisplayName: DreamByte AI Studio
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
    INFOPLIST_KEY_NSMicrophoneUsageDescription: DreamByte AI Studio necesita el micrófono para grabar narraciones y audio en tu proyecto.
    GENERATE_INFOPLIST_FILE: YES
targets:
  DreamByteAIStudio:
    type: application
    platform: iOS
    sources:
      - path: DreamByteAIStudio
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
